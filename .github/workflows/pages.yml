name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: |
          mkdir -p public
          cp index.html style.css workspace.css footer.js app.js engine.js lessons.js train.html train.css train.js curriculum.js study-state.js symmetry.js backup.js dead-stones.js ogs.js manifest.webmanifest register-sw.js sw.js icon.svg icon-192.png icon-512.png reading.js reading-worker.js reading-bank.json review.html review.css review.js sgf.js terms.js game-record.js area-score.js search-engine.js search-worker.js public/
          cp -R fonts public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
